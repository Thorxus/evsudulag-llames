<div class="dashboard-container">
    <h2>POS Dashboard</h2>
  
    <!-- Metrics Section -->
    <div class="metrics">
      <div class="metric-card" *ngFor="let metric of metrics">
        <h3>{{ metric.label }}</h3>
        <p>{{ metric.value }}</p>
      </div>
    </div>
  
    <!-- Charts Section -->
    <div class="charts">
      <div class="chart-container">
        <h3>Weekly Sales</h3>
        <canvas #salesChart></canvas>
      </div>
      <div class="chart-container">
        <h3>Sales by Category</h3>
        <canvas #categoryChart></canvas>
      </div>
    </div>
  
    <!-- Recent Transactions -->
    <div class="transactions">
      <h3>Recent Transactions</h3>
      <table>
        <thead>
          <tr>
            <th>Transaction ID</th>
            <th>Customer</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let txn of transactions">
            <td>{{ txn.id }}</td>
            <td>{{ txn.customer }}</td>
            <td>{{ txn.amount }}</td>
            <td [class]="txn.status.toLowerCase()">{{ txn.status }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
