<div class="login-container">
    <mat-card class="login-card">
      <mat-card-title class="title">Login</mat-card-title>
      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <mat-form-field class="full-width">
            <mat-label>Email/Username</mat-label>
            <input matInput formControlName="username" type="email" required />
            <mat-error *ngIf="loginForm.get('username')?.invalid">Valid email is required</mat-error>
          </mat-form-field>
  
            <mat-form-field class="full-width">
            <mat-label>Password</mat-label>
            <input matInput formControlName="password" type="password" required />
            <mat-error *ngIf="loginForm.get('password')?.invalid">Password is required</mat-error>
            </mat-form-field>
  
            <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">LOGIN</button>
        </form>
        </mat-card-content>
    </mat-card>
</div>
